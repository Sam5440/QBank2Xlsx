<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题系统测试 - QBank2Xlsx</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="themes.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563EB;
            --secondary: #3B82F6;
            --cta: #F97316;
            --background: #F8FAFC;
            --surface: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --border: #E2E8F0;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-md: 10px;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            padding: 40px;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 30px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .theme-card {
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--background);
        }

        .theme-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .theme-card.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
        }

        .theme-name {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .theme-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .color-preview {
            display: flex;
            gap: 8px;
        }

        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--border);
        }

        .test-section {
            margin-top: 40px;
            padding: 30px;
            background: var(--background);
            border-radius: var(--radius-md);
        }

        .test-section h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .status {
            padding: 15px;
            background: var(--surface);
            border-left: 4px solid var(--primary);
            margin-top: 20px;
            border-radius: var(--radius-md);
        }

        .status-label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-value {
            color: var(--text-secondary);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎨 主题系统测试页面</h1>

        <div class="theme-grid" id="themeGrid"></div>

        <div class="test-section">
            <h2>测试功能</h2>
            <button onclick="testThemeSwitch()">测试主题切换</button>
            <button onclick="testPersistence()">测试持久化</button>
            <button onclick="testAllThemes()">遍历所有主题</button>
            <button onclick="resetTheme()">重置为默认主题</button>

            <div class="status">
                <div class="status-label">当前主题:</div>
                <div class="status-value" id="currentTheme">加载中...</div>
            </div>

            <div class="status">
                <div class="status-label">本地存储:</div>
                <div class="status-value" id="localStorage">加载中...</div>
            </div>

            <div class="status">
                <div class="status-label">测试日志:</div>
                <div class="status-value" id="testLog">等待测试...</div>
            </div>
        </div>
    </div>

    <script>
        let currentThemeIndex = 0;
        let allThemes = [];

        function renderThemes() {
            const grid = document.getElementById('themeGrid');
            allThemes = themeManager.getThemeList();
            const current = themeManager.getCurrentTheme();

            grid.innerHTML = allThemes.map(theme => `
                <div class="theme-card ${theme.id === current ? 'active' : ''}"
                     onclick="selectTheme('${theme.id}')">
                    <div class="theme-name">${theme.name}</div>
                    <div class="theme-desc">${theme.description}</div>
                    <div class="color-preview">
                        <div class="color-dot" style="background: ${theme.colors.primary}"></div>
                        <div class="color-dot" style="background: ${theme.colors.secondary}"></div>
                        <div class="color-dot" style="background: ${theme.colors.cta}"></div>
                        <div class="color-dot" style="background: ${theme.colors.background}"></div>
                    </div>
                </div>
            `).join('');

            updateStatus();
        }

        function selectTheme(themeId) {
            themeManager.applyTheme(themeId);
            renderThemes();
            log(`✅ 已切换到主题: ${themeId}`);
        }

        function updateStatus() {
            document.getElementById('currentTheme').textContent = themeManager.getCurrentTheme();
            document.getElementById('localStorage').textContent = localStorage.getItem('selectedTheme') || '无';
        }

        function log(message) {
            const logEl = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            logEl.innerHTML = `[${timestamp}] ${message}<br>` + logEl.innerHTML;
        }

        function testThemeSwitch() {
            log('🧪 开始测试主题切换...');
            const themes = ['modern', 'minimal', 'dark'];
            let index = 0;

            const interval = setInterval(() => {
                if (index >= themes.length) {
                    clearInterval(interval);
                    log('✅ 主题切换测试完成');
                    return;
                }
                selectTheme(themes[index]);
                log(`切换到: ${themes[index]}`);
                index++;
            }, 1500);
        }

        function testPersistence() {
            log('🧪 测试持久化...');
            const testTheme = 'vibrant';
            themeManager.applyTheme(testTheme);

            const saved = localStorage.getItem('selectedTheme');
            if (saved === testTheme) {
                log('✅ 持久化测试通过: 主题已保存到 localStorage');
            } else {
                log('❌ 持久化测试失败: 保存的主题不匹配');
            }

            renderThemes();
        }

        function testAllThemes() {
            log('🧪 开始遍历所有主题...');
            currentThemeIndex = 0;

            const interval = setInterval(() => {
                if (currentThemeIndex >= allThemes.length) {
                    clearInterval(interval);
                    log('✅ 所有主题遍历完成');
                    return;
                }

                const theme = allThemes[currentThemeIndex];
                selectTheme(theme.id);
                log(`[${currentThemeIndex + 1}/${allThemes.length}] ${theme.name}`);
                currentThemeIndex++;
            }, 2000);
        }

        function resetTheme() {
            themeManager.applyTheme('modern');
            renderThemes();
            log('🔄 已重置为默认主题: 现代风格');
        }

        // Initialize
        window.onload = () => {
            renderThemes();
            log('✅ 主题系统初始化完成');

            // Listen for theme changes
            window.addEventListener('themeChanged', (e) => {
                log(`📢 主题变更事件: ${e.detail.theme}`);
            });
        };
    </script>
</body>
</html>
